<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6f4a1e" />
      <stop offset="45%" stop-color="#c9a24d" />
      <stop offset="70%" stop-color="#f2d68a" />
      <stop offset="100%" stop-color="#b88634" />
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151515" />
      <stop offset="100%" stop-color="#0f0f0f" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feColorMatrix type="matrix" values="1 0 0 0 0.85  0 1 0 0 0.70  0 0 1 0 0.30  0 0 0 0.8 0" />
      <feBlend in="SourceGraphic" in2="blur" mode="screen" />
    </filter>
    <filter id="panelGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feColorMatrix type="matrix" values="1 0 0 0 0.85  0 1 0 0 0.70  0 0 1 0 0.30  0 0 0 0.6 0" />
      <feBlend in="SourceGraphic" in2="blur" mode="screen" />
    </filter>
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feBlend in="SourceGraphic" in2="blur" mode="screen" />
    </filter>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#0b0b0b" />
      <circle cx="18" cy="22" r="1.2" fill="#ffffff" opacity="0.06" />
      <circle cx="60" cy="50" r="1.3" fill="#ffffff" opacity="0.05" />
      <circle cx="92" cy="36" r="1" fill="#ffffff" opacity="0.05" />
      <circle cx="30" cy="92" r="1.4" fill="#ffffff" opacity="0.06" />
      <circle cx="76" cy="100" r="1.1" fill="#ffffff" opacity="0.04" />
      <circle cx="108" cy="84" r="1.2" fill="#ffffff" opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#0b0b0b" />
  <rect width="1600" height="900" fill="url(#grain)" />

  <text x="800" y="130" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="64" letter-spacing="6" fill="url(#gold)" filter="url(#textGlow)">
    LỘ TRÌNH SINH TỒN
  </text>
  <text x="800" y="180" text-anchor="middle" font-family="Manrope, sans-serif" font-size="20" fill="#b9afa2">
    Lộ trình lên cấp, nâng quyền lợi và thu nhập.
  </text>

  <!-- Panel 1 -->
  <g filter="url(#panelGlow)">
    <rect x="120" y="240" width="420" height="520" rx="28" fill="url(#panelFill)" stroke="url(#gold)" stroke-width="2" />
  </g>
  <g filter="url(#softGlow)">
    <!-- Noodle bowl icon -->
    <path d="M250 420 C270 470 390 470 410 420" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M230 420 H430" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" />
    <path d="M280 380 C300 360 340 360 360 380" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" fill="none" />
    <line x1="420" y1="350" x2="470" y2="300" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" />
    <line x1="390" y1="340" x2="440" y2="290" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" />
  </g>
  <text x="330" y="520" text-anchor="middle" font-family="Manrope, sans-serif" font-size="16" letter-spacing="2" fill="#d9caa8">
    CẤP ĐỘ 1 - TRUY CẬP CƠ BẢN
  </text>
  <text x="330" y="580" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="28" fill="url(#gold)" filter="url(#textGlow)">
    MIỄN PHÍ ĐỒ ĂN
  </text>
  <text x="330" y="620" text-anchor="middle" font-family="Manrope, sans-serif" font-size="14" fill="#a69a8b">
    Khởi động nhẹ nhàng, trải nghiệm nền tảng.
  </text>

  <!-- Panel 2 -->
  <g filter="url(#panelGlow)">
    <rect x="590" y="240" width="420" height="520" rx="28" fill="url(#panelFill)" stroke="url(#gold)" stroke-width="2" />
  </g>
  <g filter="url(#softGlow)">
    <!-- Bed + laundry icon -->
    <rect x="720" y="380" width="200" height="50" rx="8" stroke="url(#gold)" stroke-width="6" fill="none" />
    <rect x="700" y="350" width="60" height="40" rx="6" stroke="url(#gold)" stroke-width="6" fill="none" />
    <rect x="920" y="340" width="60" height="70" rx="10" stroke="url(#gold)" stroke-width="6" fill="none" />
    <line x1="930" y1="355" x2="970" y2="355" stroke="url(#gold)" stroke-width="5" />
    <line x1="930" y1="370" x2="970" y2="370" stroke="url(#gold)" stroke-width="5" />
  </g>
  <text x="800" y="520" text-anchor="middle" font-family="Manrope, sans-serif" font-size="16" letter-spacing="2" fill="#d9caa8">
    CẤP ĐỘ 2 - CHUYÊN NGHIỆP
  </text>
  <text x="800" y="580" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="26" fill="url(#gold)" filter="url(#textGlow)">
    MIỄN PHÍ CHỖ Ở + GIẶT LÀ
  </text>
  <text x="800" y="620" text-anchor="middle" font-family="Manrope, sans-serif" font-size="14" fill="#a69a8b">
    Nâng cấp quyền lợi và hỗ trợ vận hành.
  </text>

  <!-- Panel 3 -->
  <g filter="url(#panelGlow)">
    <rect x="1060" y="240" width="420" height="520" rx="28" fill="url(#panelFill)" stroke="url(#gold)" stroke-width="2" />
  </g>
  <g filter="url(#softGlow)">
    <!-- Badge + coins icon -->
    <circle cx="1220" cy="380" r="38" stroke="url(#gold)" stroke-width="6" fill="none" />
    <polygon points="1220,350 1228,370 1250,372 1232,386 1238,408 1220,396 1202,408 1208,386 1190,372 1212,370" fill="url(#gold)" />
    <circle cx="1320" cy="420" r="24" stroke="url(#gold)" stroke-width="6" fill="none" />
    <circle cx="1355" cy="400" r="24" stroke="url(#gold)" stroke-width="6" fill="none" />
  </g>
  <text x="1270" y="520" text-anchor="middle" font-family="Manrope, sans-serif" font-size="16" letter-spacing="2" fill="#d9caa8">
    CẤP ĐỘ 3 - BẬC THẦY
  </text>
  <text x="1270" y="580" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="24" fill="url(#gold)" filter="url(#textGlow)">
    TRƯỞNG NHÓM - THU NHẬP THỤ ĐỘNG
  </text>
  <text x="1270" y="620" text-anchor="middle" font-family="Manrope, sans-serif" font-size="14" fill="#a69a8b">
    Dẫn đội, nhận thu nhập và quyền lực cộng đồng.
  </text>
</svg>
